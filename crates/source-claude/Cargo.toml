[package]
name = "tokenscope-source-claude"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "tokenscope_source_claude"
path = "src/lib.rs"

[dependencies]
tokenscope-core-domain = { path = "../core-domain" }
tokenscope-local-store = { path = "../local-store" }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
