[package]
name = "tokenscope-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.90"

[lib]
name = "tokenscope_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-autostart = "2.0.0"
tokenscope-local-ipc = { path = "../../../crates/local-ipc" }
tokenscope-local-store = { path = "../../../crates/local-store" }
tokenscope-core-domain = { path = "../../../crates/core-domain" }
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "8.2"
tokenscope-sync-client = { path = "../../../crates/sync-client" }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25"
sha2 = "0.10"
iana-time-zone = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
zeroize = { version = "1.8", features = ["alloc"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
auto-launch = "0.6.0"
winreg = "0.56.0"

# Keep WebView/GTK dependencies isolated from the lightweight Agent workspace.
[workspace]

# This standalone Tauri package has its own Cargo workspace and build profile.
[profile.dev]
debug = 1
incremental = false

[profile.test]
debug = 1
incremental = false
