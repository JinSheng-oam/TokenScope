name: Desktop UI, Agent and Installer CI
on:
  push:
    paths: ['apps/desktop/**', 'crates/**', 'scripts/stage-agent.mjs', 'scripts/verify_m012.py', 'scripts/verify_m102.py', 'scripts/verify_m104.py', 'scripts/verify_m105.py', 'scripts/verify_m106.py', 'scripts/verify_m107.py', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.github/workflows/desktop-ci.yml']
  pull_request:
    paths: ['apps/desktop/**', 'crates/**', 'scripts/stage-agent.mjs', 'scripts/verify_m012.py', 'scripts/verify_m102.py', 'scripts/verify_m104.py', 'scripts/verify_m105.py', 'scripts/verify_m106.py', 'scripts/verify_m107.py', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.github/workflows/desktop-ci.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  legacy-contracts:
    # These historical source-pattern checks are kept in branch CI.
    # Release builds use the compiled tests and the installer artifact gate.
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Historical milestone contracts
        run: |
          for gate in m012 m102 m104 m105 m106 m107; do
            python "scripts/verify_${gate}.py" || failed=1
          done
          exit "${failed:-0}"

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb,appimage
          - os: windows-2022
            bundles: msi,nsis
          - os: macos-15
            bundles: dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - name: Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libfuse2 libdbus-1-dev
        working-directory: .
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Type and Svelte checks
        run: npm run check
      - name: UI tests
        run: npm run test
      - name: Vite production build
        run: npm run build
      - name: Rust workspace checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
        working-directory: .
      - name: Stage the release Agent
        run: npm run pretauri:build
      - name: Desktop Rust shell lint
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
        working-directory: .
      - name: Build installer with embedded Agent
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tokenscope-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
