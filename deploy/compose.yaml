name: tokenscope
services:
  hub-data-init:
    image: alpine:3.21
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /data && chmod 0700 /data"]
    volumes:
      - hub-data:/data
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt:
      - no-new-privileges:true
    restart: "no"

  hub:
    build:
      context: ..
      dockerfile: deploy/hub/Dockerfile
    image: tokenscope-hub:local
    restart: unless-stopped
    environment:
      TOKENSCOPE_ADMIN_TOKEN: ${TOKENSCOPE_ADMIN_TOKEN:?set TOKENSCOPE_ADMIN_TOKEN in .env}
      TOKENSCOPE_TRUSTED_PROXY_CIDRS: 172.30.0.0/24
      TZ: UTC
    command: ["serve", "--db", "/data/tokenscope-hub.db", "--listen", "0.0.0.0:8787"]
    volumes:
      - hub-data:/data
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      hub-data-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      TOKENSCOPE_DOMAIN: ${TOKENSCOPE_DOMAIN:?set TOKENSCOPE_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - backend
    depends_on:
      hub:
        condition: service_healthy
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  hub-data:
  caddy-data:
  caddy-config:
